{% extends "base.html" %}

{% block content %}

<h2>Sent Emails</h2>

<table border="1" cellpadding="10">

<tr>
<th>To</th>
<th>Subject</th>
<th>Date</th>
</tr>

{% for email in emails %}

<tr>
<td>{{ email.receiver }}</td>

<td>
<a href="/thread/{{ email.thread_id }}">
{{ email.subject }}
</a>
</td>

<td>{{ email.created_at }}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
